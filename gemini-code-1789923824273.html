<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KalaKriti — Digital Atlas of Indian Art Traditions</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f141d;
            --panel-bg: #171f2c;
            --panel-border: #2a364a;
            --accent-gold: #e5ac50;
            --accent-coral: #ff6b52;
            --text-main: #f0f4f9;
            --text-muted: #94a3b8;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation */
        header {
            background: linear-gradient(180deg, #182232 0%, #0f141d 100%);
            border-bottom: 1px solid var(--panel-border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title span {
            font-size: 0.8rem;
            font-family: var(--font-body);
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0;
        }

        .stats-badge {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stats-badge strong {
            color: var(--accent-gold);
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            position: relative;
            height: calc(100vh - 65px);
        }

        /* Left Control Panel */
        sidebar {
            width: 360px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 20px rgba(0,0,0,0.3);
        }

        .panel-section {
            padding: 18px;
            border-bottom: 1px solid var(--panel-border);
        }

        .search-box {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent-gold);
        }

        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .filter-btn {
            background: var(--bg-dark);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-gold);
            color: var(--bg-dark);
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        /* Scrollable Cards Container */
        .cards-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .art-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .art-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(229, 172, 80, 0.15);
        }

        .art-card h4 {
            font-family: var(--font-heading);
            color: var(--accent-gold);
            font-size: 1rem;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .art-card .region-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .art-card .style-tag {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.7rem;
            background-color: rgba(255, 107, 82, 0.15);
            color: var(--accent-coral);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Map Container & CSS Filter for Dark High-Contrast Look */
        #map {
            flex: 1;
            height: 100%;
            background-color: #0b0e14;
        }

        .dark-map-tiles {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        /* Custom Leaflet Popup Styling */
        .leaflet-popup-content-wrapper {
            background: var(--panel-bg) !important;
            border: 1px solid var(--panel-border);
            border-radius: 12px !important;
            padding: 12px !important;
            color: var(--text-main) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
        }

        .leaflet-popup-tip {
            background: var(--panel-bg) !important;
        }

        .popup-card {
            max-width: 260px;
        }

        .popup-card h3 {
            font-family: var(--font-heading);
            color: var(--accent-gold);
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .popup-card .meta {
            font-size: 0.75rem;
            color: var(--accent-coral);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .popup-card p {
            font-size: 0.82rem;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .popup-card .era-badge {
            font-size: 0.7rem;
            background: var(--bg-dark);
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            display: inline-block;
        }

        /* Custom Glowing Circular Marker */
        .custom-pin {
            width: 22px;
            height: 22px;
            background-color: #ff6b52;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 107, 82, 0.9);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .custom-pin:hover {
            transform: scale(1.3);
            background-color: var(--accent-gold);
            box-shadow: 0 0 16px rgba(229, 172, 80, 1);
        }

        @media (max-width: 768px) {
            .workspace {
                flex-direction: column-reverse;
            }
            sidebar {
                width: 100%;
                height: 40%;
            }
            #map {
                height: 60%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">
            KALAKRITI <span>Indian Art Atlas</span>
        </div>
        <div class="stats-badge">
            <div>Traditions: <strong id="location-count">12</strong></div>
            <div>Regions: <strong>10 States</strong></div>
        </div>
    </header>

    <div class="workspace">
        <sidebar>
            <div class="panel-section">
                <input type="text" id="searchInput" class="search-box" placeholder="Search tradition, state, or era..." oninput="filterArtworks()">
                
                <div class="category-filters">
                    <button class="filter-btn active" onclick="applyCategory('All', this)">All</button>
                    <button class="filter-btn" onclick="applyCategory('Textile & Print', this)">Textile</button>
                    <button class="filter-btn" onclick="applyCategory('Painting', this)">Painting</button>
                    <button class="filter-btn" onclick="applyCategory('Sculpture & Craft', this)">Craft</button>
                    <button class="filter-btn" onclick="applyCategory('Mural', this)">Mural</button>
                </div>
            </div>

            <div class="cards-list" id="cardsContainer">
                <!-- Dynamically Populated Cards -->
            </div>
        </sidebar>

        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const artData = [
            {
                id: 1,
                title: "Phad Painting",
                location: "Bhilwara, Rajasthan",
                coords: [25.3407, 74.6313],
                category: "Painting",
                era: "14th Century CE Origin",
                description: "Scroll paintings on long canvas sheets depicting folk deities like Pabuji and Devnarayan, traditionally performed by travelling bard-singers."
            },
            {
                id: 2,
                title: "Cheriyal Scrolls",
                location: "Siddipet, Telangana",
                coords: [18.1018, 78.8520],
                category: "Painting",
                era: "15th Century CE",
                description: "Narrative scroll art painted in vibrant primary colors (predominantly red backgrounds) depicting Indian mythological epics and local folklore."
            },
            {
                id: 3,
                title: "Patan Patola",
                location: "Patan, Gujarat",
                coords: [23.8493, 72.1193],
                category: "Textile & Print",
                era: "12th Century CE Patronage",
                description: "Double-ikat silk weaving mastery where warp and weft threads are resist-dyed prior to weaving, producing identical intricate patterns on both sides."
            },
            {
                id: 4,
                title: "Dhokra Metal Craft",
                location: "Bastar, Chhattisgarh",
                coords: [19.0744, 81.9619],
                category: "Sculpture & Craft",
                era: "4000+ Years Old (Lost-Wax)",
                description: "Non-ferrous metal casting using lost-wax technique, celebrated for primitive, rustic figurines depicting tribal motifs and nature."
            },
            {
                id: 5,
                title: "Mattancherry Murals",
                location: "Kochi, Kerala",
                coords: [9.9582, 76.2599],
                category: "Mural",
                era: "16th Century CE",
                description: "Temple and palace wall murals painted using rich natural pigments, depicting scenes from the Ramayana with highly stylized facial iconography."
            },
            {
                id: 6,
                title: "Bagh Print",
                location: "Dhar, Madhya Pradesh",
                coords: [22.3703, 74.7978],
                category: "Textile & Print",
                era: "Traditional Tribal Craft",
                description: "Hand block printing with carved teak wood blocks using naturally derived vegetable dyes, characterized by geometric and floral repeat patterns."
            },
            {
                id: 7,
                title: "Santhal Folk Painting",
                location: "Purulia, West Bengal",
                coords: [23.3321, 86.3652],
                category: "Painting",
                era: "Ancient Tribal Heritage",
                description: "Simple, expressive figurative art created by the Santhal tribe depicting village celebrations, hunting, harvest dances, and music."
            },
            {
                id: 8,
                title: "Chamba Rumal",
                location: "Chamba, Himachal Pradesh",
                coords: [32.5534, 76.1258],
                category: "Textile & Print",
                era: "18th Century CE",
                description: "Pictorial embroidery on handkerchiefs using the unspun silk thread 'Do-Rukha' (double-sided stitch), capturing Pahari miniature painting themes."
            },
            {
                id: 9,
                title: "Pithora Painting",
                location: "Chhota Udaipur, Gujarat",
                coords: [22.3072, 73.8163],
                category: "Mural",
                era: "Rathwa Tribal Ritual",
                description: "Sacred ritualistic wall paintings depicting horses, divine processions, and cosmic symbols to bring prosperity to tribal households."
            },
            {
                id: 10,
                title: "Channapatna Craft",
                location: "Ramanagara, Karnataka",
                coords: [12.6518, 77.2089],
                category: "Sculpture & Craft",
                era: "18th Century (Tipu Sultan Era)",
                description: "Handcrafted wooden toys and decorative items made from ivory wood and turned on lathes using non-toxic natural lacquer colors."
            },
            {
                id: 11,
                title: "Applique Work (Pipili)",
                location: "Puri District, Odisha",
                coords: [20.1169, 85.8312],
                category: "Textile & Print",
                era: "12th Century Temple Origins",
                description: "Stitching geometric and animal fabric cutouts onto base cloths, traditionally crafted for the grand ritual banners of the Jagannath Temple."
            },
            {
                id: 12,
                title: "Basholi Miniature Art",
                location: "Kathua, Jammu & Kashmir",
                coords: [32.5028, 75.8151],
                category: "Painting",
                era: "17th - 18th Century CE",
                description: "First school of Pahari painting known for expressive large eyes, bold intense primary colors, and glossy green beetle wings used to represent jewelry."
            }
        ];

        let selectedCategory = "All";
        let activeMarkers = [];

        // Initialize Map
        const map = L.map('map', { zoomControl: false }).setView([22.5937, 78.9629], 5);
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Standard OpenStreetMap Tiles with Custom CSS Dark Inversion
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            className: 'dark-map-tiles',
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        function createCustomPin() {
            return L.divIcon({
                className: '',
                html: `<div class="custom-pin"></div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11],
                popupAnchor: [0, -11]
            });
        }

        function renderCards(data) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'art-card';
                card.onclick = () => focusLocation(item);

                card.innerHTML = `
                    <h4>${item.title}</h4>
                    <div class="region-tag">${item.location}</div>
                    <span class="style-tag">${item.category}</span>
                `;
                container.appendChild(card);
            });

            document.getElementById('location-count').textContent = data.length;
        }

        function renderMarkers(data) {
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];

            data.forEach(item => {
                const marker = L.marker(item.coords, { icon: createCustomPin() }).addTo(map);

                const popupContent = `
                    <div class="popup-card">
                        <h3>${item.title}</h3>
                        <div class="meta">${item.location} • ${item.category}</div>
                        <p>${item.description}</p>
                        <span class="era-badge">📅 ${item.era}</span>
                    </div>
                `;

                marker.bindPopup(popupContent);
                marker.artId = item.id;
                activeMarkers.push(marker);
            });
        }

        function focusLocation(item) {
            map.flyTo(item.coords, 7, { duration: 1.2 });

            const targetMarker = activeMarkers.find(m => m.artId === item.id);
            if (targetMarker) {
                setTimeout(() => targetMarker.openPopup(), 400);
            }
        }

        function filterArtworks() {
            const query = document.getElementById('searchInput').value.toLowerCase();

            const filtered = artData.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(query) ||
                                      item.location.toLowerCase().includes(query) ||
                                      item.era.toLowerCase().includes(query) ||
                                      item.category.toLowerCase().includes(query);

                const matchesCat = (selectedCategory === "All") || (item.category === selectedCategory);

                return matchesSearch && matchesCat;
            });

            renderCards(filtered);
            renderMarkers(filtered);
        }

        function applyCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterArtworks();
        }

        renderCards(artData);
        renderMarkers(artData);
    </script>
</body>
</html>
